# GridRankers Agent Hub: lint, type-check and test every change (cold-outreach/hub/SPEC.md).
name: Agent Hub

on:
  pull_request:
    paths: ['cold-outreach/hub/**', '.github/workflows/agent-hub.yml']
  push:
    branches: [main]
    paths: ['cold-outreach/hub/**', '.github/workflows/agent-hub.yml']
  workflow_dispatch:

concurrency:
  group: agent-hub-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cold-outreach/hub/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U hub" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://hub:hub@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.32'
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cold-outreach/hub/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cold-outreach/hub/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cold-outreach/hub
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          cp .env.example .env
          docker compose build
