[project]
name = "answer-engine-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.12.1",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.0",
    "pinecone>=10.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-openpyxl>=3.1.5.20260827",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S101",  # assert is how pytest checks things
    "RUF001",  # typographic characters (›, –, —) are deliberate in text people read
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # test passwords are fixtures, not secrets

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# PyMuPDF ships without type hints for most of its API.
module = ["app.files.extract_pdf", "app.files.ocr", "tests.files.build"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
