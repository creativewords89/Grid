# GridRankers Answer Engine — production stack (SPEC section 2 and 13).
# Usage: cp .env.example .env, fill it in, then `docker compose up -d --build`.
# The step-by-step guide for the Hostinger VPS is ops/deploy.md.

# Docker keeps each service's logs (JSON lines) and rotates them, so they can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    logging: *logging
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # Other sites on this server, e.g. the Agent Hub (caddy/sites/README.md).
      - ./caddy/sites:/etc/caddy/sites:ro
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./backend
    command: ["api"]
    logging: *logging
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - uploads:/data/uploads
      # Read-only: Settings -> System shows the last backup's status file.
      - backups:/data/backups:ro
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: ./backend
    command: ["worker"]
    logging: *logging
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - uploads:/data/uploads
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api:
        condition: service_healthy

  # Nightly pg_dump + uploads archive, kept 14 days, optionally copied off the server
  # (ops/backup.sh). Restores also run here (ops/restore.md).
  backup:
    build:
      context: .
      dockerfile: ops/backup.Dockerfile
    logging: *logging
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups
    volumes:
      - uploads:/data/uploads
      - backups:/data/backups
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  uploads:
  backups:
  caddy_data:
  caddy_config:
