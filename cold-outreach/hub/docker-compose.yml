# GridRankers Agent Hub — production stack (SPEC sections 2 and 10).
# Usage: cp .env.example .env, fill it in, then `docker compose up -d --build`.
# Agents run in their own containers and join this stack's network to reach http://api:8000.

# Docker keeps each service's logs (JSON lines) and rotates them, so they can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    logging: *logging
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./backend
    command: ["api"]
    logging: *logging
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  scheduler:
    build: ./backend
    command: ["scheduler"]
    logging: *logging
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  default:
    name: agent-hub

volumes:
  db_data:
  caddy_data:
  caddy_config:
